plugins {
    id 'com.android.application'
}

android {
    namespace 'com.presenova.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.presenova.app'
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildFeatures { buildConfig true }

    def webClientId = providers.gradleProperty('presenovaWebClientId').getOrElse('')
    defaultConfig.buildConfigField 'String', 'PRESENOVA_WEB_CLIENT_ID', '"' + webClientId.replace('\\', '\\\\').replace('"', '\\"') + '"'
}

dependencies {
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
    implementation 'androidx.webkit:webkit:1.12.1'
}
